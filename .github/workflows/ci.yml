name: CI

on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    name: iOS app + SnarwalCore (Xcode)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: SnarwalCore tests
        run: swift test --package-path Packages/SnarwalCore
      - name: Build and test the app in the iOS simulator
        run: |
          set -o pipefail
          # newest available iPhone and iPad simulators
          pick() { xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('$1')))"; }
          IPHONE=$(pick iPhone); IPAD=$(pick iPad)
          echo "IPHONE=$IPHONE" >> "$GITHUB_ENV"; echo "IPAD=$IPAD" >> "$GITHUB_ENV"
          xcodebuild \
            -project ios/Snarwal.xcodeproj \
            -scheme Snarwal \
            -destination "id=$IPHONE" \
            -derivedDataPath build \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | grep -E "Test Case|Executed|error:|warning: .*/ios/|\*\* (TEST|BUILD)"
      - name: Screenshots
        if: always()
        timeout-minutes: 15
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Snarwal.app
          ID=io.github.rainerzufall00.snarwal
          mkdir -p screenshots
          # macOS has no `timeout`; perl's alarm does the job
          limit() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          prepare() {
            echo "== preparing $1"
            limit 240 xcrun simctl boot "$1" 2>/dev/null || true
            limit 240 xcrun simctl bootstatus "$1" -b || echo "bootstatus timed out"
            limit 120 xcrun simctl install "$1" "$APP"
          }
          shoot() { # device name seconds args...
            local dev=$1 name=$2 wait=$3; shift 3
            echo "== $name"
            limit 30 xcrun simctl terminate "$dev" $ID 2>/dev/null || true
            limit 60 xcrun simctl launch "$dev" $ID "$@" || echo "launch failed"
            sleep "$wait"
            limit 60 xcrun simctl io "$dev" screenshot "screenshots/$name.png" || echo "screenshot failed"
          }
          prepare "$IPHONE"
          shoot "$IPHONE" iphone-1-start 25
          shoot "$IPHONE" iphone-2-plate 12 -SnarwalDemo
          shoot "$IPHONE" iphone-3-preview 60 -SnarwalDemo -SnarwalAutoSlice
          shoot "$IPHONE" iphone-4-printer 12 -SnarwalPrinterTab
          limit 120 xcrun simctl shutdown "$IPHONE" || true
          prepare "$IPAD"
          shoot "$IPAD" ipad-1-plate 15 -SnarwalDemo
          shoot "$IPAD" ipad-2-printer 12 -SnarwalPrinterTab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
      - name: Publish screenshots to the ci-screenshots branch
        if: github.ref == 'refs/heads/master'
        run: |
          cd screenshots
          for f in *.png; do sips -Z 1000 "$f" >/dev/null; done
          git init -q
          git checkout -q -b ci-screenshots
          git add *.png
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots

  engine:
    name: Slicing engine (Kiri:Moto in Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: engine
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and test
        working-directory: engine
        run: |
          npm run build
          npm test
