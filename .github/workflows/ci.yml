name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    name: iOS app + SnarwalCore (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: SnarwalCore tests
        run: swift test --package-path Packages/SnarwalCore
      - name: Build and test the app in the iOS simulator
        run: |
          # first available iPhone simulator
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "Simulator: $UDID"
          xcodebuild \
            -project ios/Snarwal.xcodeproj \
            -scheme Snarwal \
            -destination "id=$UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            test

  engine:
    name: Slicing engine (Kiri:Moto in Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: engine
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and test
        working-directory: engine
        run: |
          npm run build
          npm test
